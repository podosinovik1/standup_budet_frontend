                                <button type="button" id="izdk5f-2"
                                    class="event_card_button_style_2">Забронировать</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            document.addEventListener('DOMContentLoaded', function () {
                const burger = document.getElementById('burgerBtn');
                const offcanvas = document.getElementById('offcanvas');
                const overlay = document.getElementById('overlay');
                const closeBtn = document.getElementById('closeMenu');
                const offcanvasContent = document.getElementById('offcanvasContent');

                // Клонируем скрытый контейнер с контактами
                const hiddenContacts = document.getElementById('contacts_hidden');
                if (hiddenContacts && offcanvasContent) {
                    offcanvasContent.innerHTML = '';
                    const clone = hiddenContacts.cloneNode(true);
                    clone.removeAttribute('id');
                    // Дополнительное центрирование через инлайн-стили (основное уже в CSS)
                    clone.style.display = 'flex';
                    clone.style.flexDirection = 'column';
                    clone.style.alignItems = 'center';
                    clone.style.gap = '20px';
                    offcanvasContent.appendChild(clone);
                }

                function openMenu() {
                    burger.classList.add('active');
                    offcanvas.classList.add('active');
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }

                function closeMenu() {
                    burger.classList.remove('active');
                    offcanvas.classList.remove('active');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                }

                burger.addEventListener('click', openMenu);
                closeBtn.addEventListener('click', closeMenu);
                overlay.addEventListener('click', closeMenu);

                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && offcanvas.classList.contains('active')) {
                        closeMenu();
                    }
                });
            });
        })();
    </script>
</body>
