<!DOCTYPE html>
<html>

<head>
    <title>О мероприятии</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="about.css">
</head>

<body>
    <div class="navbar">
        <div class="logo_container"><img src="images/logo.png" alt="Логотип" class="logo" />
        </div>
    </div>
    <div class="main">
        <div class="about-page">
            <div class="about-page__event">

                <img class="event-poster" src="images/show.jpg" />

                <div class="event-info">
                    <div class="page event-info__name">Стендап Вечер</div>
                    <div class="page event-info__venue">Пивной Бульвар</div>
                    <div class="page event-info__description">Смешные комики, отличная сцена, берите хорошее настроение
                        и
                        приходите смеяться к нам в эту пятницу.
                    </div>

                    <div class="page event-info__datetime">
                        <div class="date">Дата</div>
                        <div class="data date-data">04.09.2026</div>
                        <div class="time">Время</div>
                        <div class="data time-data">19:30</div>
                        <!-- <div class="price">Цена</div>
                        <div class="data price-data">500₽</div> -->
                    </div>

                    <div class="booking">
                        <button type="button" class="page booking-button" data-tc-event=""
                            data-tc-token="">Забронировать</button>
                        <!-- <div class="price">500₽</div> -->
                    </div>

                </div>

            </div>

            <div class="about-page__gallery">
                <img class="gallery-image main-image" src="gallery/main.jpg" />
                <img class="gallery-image" src="gallery/1.jpg" />
                <img class="gallery-image" src="gallery/2.jpg" />
                <img class="gallery-image" src="gallery/3.jpg" />
                <img class="gallery-image" src="gallery/4.jpg" />
            </div>

            <div class="about-page__venue">

                <iframe frameborder="0" class="map"
                    src="https://yandex.ru/map-widget/v1/?um=constructor%3Ae51d0efc79f9c4a895e604f7275d87b8a866c3964f3fcc14ab13ed2483cd63f0&amp;source=constructor"
                    frameborder="0"></iframe>

                

                <div class="page venue-info">
                    <div class="venue-info__name">Пивной Бульвар</div>

                    <img class="venue-icon" src="images/map-point.png"/>
                    <div class="venue-info__address">Проспект Столыпина, 29</div>
                    
                    <img class="venue-icon" src="images/phone.png"/>
                    <div class="venue-info__phone highlight-hover">
                        <a href="tel:+79518849845">+79518849845</a>
                    </div>

                    <img class="venue-icon" src="images/link.png"/>
                    <div class="venue-info__site highlight-hover" >
                        <a href="https://pivnoybulvar.ru/">pivnoybulvar.ru</a>
                    </div>           
                </div>
            </div>
        </div>
    </div>
    <div>
        <div class="footer">
            <div></div>
            <div class="footer__contacts"><a href="mailto:standupbudet@gmail.com"
                    class="highlight-hover page">standupbudet@gmail.com</a><a
                    href="https://www.instagram.com/standupbudet" class="highlight-hover"><img src="images/inst.png"
                        alt="Instagram" class="social_icons" /></a><a href="https://vk.com/standupbudet"
                    class="highlight-hover"><img src="images/vk.png" alt="ВКонтакте" class="social_icons" /></a><a
                    href="https://t.me/standupbudet" class="highlight-hover"><img src="images/tg.png" alt="Telegram"
                        class="social_icons" /></a>
            </div>
            <div></div>
        </div>
    </div>
    <script src="about.js"></script>
</body>

</html>
